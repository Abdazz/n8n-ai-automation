services:
  postgres:
    image: postgres:16-alpine
    container_name: golden_market_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./00-create-nocodb-db.sql:/docker-entrypoint-initdb.d/00-create-nocodb-db.sql:ro
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - golden_market_net

  n8n:
    image: n8nio/n8n:latest
    container_name: golden_market_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- n8n's own internal database (separate schema, same Postgres instance) ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n

      # --- Access / webhook config ---
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/

      # --- Basic auth on the editor (change/remove if you put auth elsewhere) ---
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}

      GENERIC_TIMEZONE: Africa/Ouagadougou
      TZ: Africa/Ouagadougou

      # Autorise l'import du module natif 'crypto' dans les nodes Code
      # (nécessaire pour la vérification de signature HMAC des webhooks Meta)
      NODE_FUNCTION_ALLOW_BUILTIN: crypto

      # Autorise l'accès à $env (variables d'environnement) depuis les nodes Code
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      # --- WhatsApp Cloud API (utilisées dans les nodes du workflow) ---
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}

      # --- Mobile Money (infos statiques pour les instructions de paiement) ---
      ORANGE_MONEY_NUMBER: ${ORANGE_MONEY_NUMBER}
      ORANGE_MONEY_NAME: ${ORANGE_MONEY_NAME}

      # --- Numéro personnel pour les notifications d'escalade humaine ---
      OWNER_WHATSAPP_NUMBER: ${OWNER_WHATSAPP_NUMBER}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"   # exposé uniquement en local ; Apache gère le HTTPS public en reverse proxy
    networks:
      - golden_market_net

  nocodb:
    image: nocodb/nocodb:latest
    container_name: golden_market_nocodb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # NocoDB stocke ses propres métadonnées (tables préfixées nc_*) dans cette même base
      # Format JSON structuré plutôt que NC_DB (URL) — évite les soucis si le mot de passe
      # contient des caractères spéciaux (&, ?, @, #, etc.) qui casseraient le parsing d'URL.
      # NocoDB stocke ses propres métadonnées (tables nc_*) dans une base DÉDIÉE
      # (nocodb_meta), séparée des données applicatives (golden_market) — évite
      # que les tables internes de NocoDB se mélangent avec products/orders/etc.
      NC_DB_JSON: '{"client":"pg","connection":{"host":"postgres","port":5432,"user":"${POSTGRES_USER}","password":"${POSTGRES_PASSWORD}","database":"nocodb_meta"}}'
      NC_PUBLIC_URL: https://${NOCODB_HOST}

      # Autorise NocoDB à ajouter une source de données (Add Data Source) pointant
      # vers un hôte du réseau privé/interne Docker (protection SSRF active par défaut)
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
    volumes:
      - nocodb_data:/usr/app/data
    ports:
      - "127.0.0.1:8090:8080"   # exposé uniquement en local ; Apache gère le HTTPS public en reverse proxy
    networks:
      - golden_market_net

networks:
  golden_market_net:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  nocodb_data:
