# À placer dans /etc/apache2/sites-available/n8n.conf sur le VPS

<VirtualHost *:80>
    ServerName n8n.golden-market.co

    ProxyPreserveHost On
    ProxyRequests Off

    # Support des websockets (nécessaire pour l'éditeur n8n en temps réel)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:5678/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*) http://127.0.0.1:5678/$1 [P,L]

    ProxyPass / http://127.0.0.1:5678/
    ProxyPassReverse / http://127.0.0.1:5678/

    ErrorLog ${APACHE_LOG_DIR}/n8n-error.log
    CustomLog ${APACHE_LOG_DIR}/n8n-access.log combined
</VirtualHost>
