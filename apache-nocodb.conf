# À placer dans /etc/apache2/sites-available/nocodb.conf sur le VPS
# Remplace admin.golden-market.co par ton vrai sous-domaine (= valeur de NOCODB_HOST dans .env)

<VirtualHost *:80>
    ServerName admin.golden-market.co

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:8090/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*) http://127.0.0.1:8090/$1 [P,L]

    ProxyPass / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/

    ErrorLog ${APACHE_LOG_DIR}/nocodb-error.log
    CustomLog ${APACHE_LOG_DIR}/nocodb-access.log combined
</VirtualHost>
